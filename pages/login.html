
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | TalentBridge AI</title>
    <link rel="stylesheet" href="../css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>

<header class="header">
    <a href="index.html" class="brand">
        <span class="brand-icon">▱</span>
        <span class="brand-text">
            <strong>TalentBridge <span>AI</span></strong>
            <small>Bridging Talent. Building Tomorrow.</small>
        </span>
    </a>

    <nav class="header-nav">
        <a href="signup-role.html" class="signup-link">Sign Up</a>
        <span class="divider"></span>
        <a href="index.html" class="home-link">
            <span class="home-icon">⌂</span>
            Back to Home
        </a>
    </nav>
</header>

<main class="main-container">

    <section class="login-card">

        <div class="card-heading">
            <div class="heading-icon">
                <svg viewBox="0 0 64 64" fill="none">
                    <rect x="12" y="27" width="40" height="29" rx="5"
                          stroke="currentColor" stroke-width="4"/>
                    <path d="M21 27V18C21 12 25.5 8 32 8C38.5 8 43 12 43 18V27"
                          stroke="currentColor" stroke-width="4"
                          stroke-linecap="round"/>
                    <circle cx="32" cy="40" r="4" fill="currentColor"/>
                    <path d="M32 44V48" stroke="currentColor"
                          stroke-width="4" stroke-linecap="round"/>
                </svg>
            </div>

            <h1>Welcome Back!</h1>
            <p>Sign in to continue your TalentBridge AI journey.</p>
        </div>

        <form action="#" method="post">

            <div class="form-group">
                <label for="email">Email Address <span>*</span></label>

                <div class="input-wrapper">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="5" width="18" height="14" rx="2"
                              stroke="currentColor" stroke-width="1.8"/>
                        <path d="M4 7L12 13L20 7"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>

                    <input type="email" id="email" name="email"
                           placeholder="Enter your email address"
                           autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password <span>*</span></label>

                <div class="input-wrapper">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="5" y="10" width="14" height="11" rx="2"
                              stroke="currentColor" stroke-width="1.8"/>
                        <path d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10"
                              stroke="currentColor" stroke-width="1.8"/>
                        <circle cx="12" cy="15" r="1.2" fill="currentColor"/>
                    </svg>

                    <input type="password" id="password" name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password" required>

                    <button type="button" class="toggle-password"
                            onclick="togglePassword()"
                            aria-label="Show or hide password">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M2 12S5.5 5.5 12 5.5S22 12 22 12S18.5 18.5 12 18.5S2 12 2 12Z"
                                  stroke="currentColor" stroke-width="1.8"/>
                            <circle cx="12" cy="12" r="3"
                                    stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-option">
                    <input type="checkbox" name="remember">
                    <span>Remember Me</span>
                </label>

                <a href="#" class="forgot-link">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="login-btn">
                Sign In
                <span class="arrow">→</span>
            </button>

        </form>

        <div class="social-section">
            <div class="separator">
                <span></span>
                <p>or continue with</p>
                <span></span>
            </div>

            <div class="social-buttons">
                <button type="button" class="social-btn"
                        aria-label="Continue with Google">
                    <span class="google-logo">G</span>
                </button>

                <button type="button" class="social-btn"
                        aria-label="Continue with LinkedIn">
                    <span class="linkedin-logo">in</span>
                </button>

                <button type="button" class="social-btn"
                        aria-label="Continue with Microsoft">
                    <span class="microsoft-logo">
                        <i></i><i></i><i></i><i></i>
                    </span>
                </button>
            </div>
        </div>

        <div class="signup-prompt">
            <p>Don't have an account?</p>

            <div class="signup-links">
                <a href="jobseeker-signup.html">Join as Job Seeker</a>
                <span>or</span>
                <a href="company-signup.html">Join as Employer</a>
            </div>
        </div>

    </section>
</main>

<script>
    function togglePassword() {
        const password = document.getElementById("password");

        password.type =
            password.type === "password" ? "text" : "password";
    }
</script>

</body>
</html>
