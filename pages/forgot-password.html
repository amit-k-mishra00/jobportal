<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | TalentBridge AI</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/forgot-password.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/motion.css">
    <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <script src="../js/dark-mode.js"></script>
</head>
<body data-public-page data-auth-page>
<header class="navbar">
  <div class="nav-container">
    <div class="logo"><a href="../index.html">TalentBridge AI<span class="logo-accent">:</span></a></div>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="employer.html">For Employers</a>
      <a href="jobseaker.html">For Job Seekers</a>
      <a href="pricing.html">Pricing</a>
      
    </nav>
    <div class="auth-actions">
      <a href="login.html" class="auth-btn auth-signin">Sign In</a>
      <a href="signup-role.html" class="auth-btn auth-signup">Sign Up</a>
      <a href="dashboard/cdashboard.html" class="auth-btn auth-dashboard">Dashboard</a>
    </div>
  </div>
  
</header>
<main class="main-container">
    <section class="login-card">
        <div class="card-heading">
            <h1>Forgot your password?</h1>
            <p>Enter the email address associated with your account to request a password reset.</p>
        </div>
        <form action="#" method="post">
            <div class="form-group">
                <label for="email">Email Address <span>*</span></label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
                </div>
            </div>
            <button type="submit" class="login-btn">Send Reset Link <span class="arrow">&rarr;</span></button>
        </form>
        <div class="signup-prompt">
            <a href="login.html">Back to Sign In</a>
        </div>
    </section>
</main>
<script src="../js/motion.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
